name: "Build & Push Container Image"

concurrency: release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
permissions:
  contents: read
  packages: write
  actions: write
jobs:
  publish:
    name: "Build & Push to GHCR"
    runs-on: ubuntu-latest
    env:
      DAGGER_VERSION: "0.21.11"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: /tmp/dagger-state.tar
          key: dagger-state-${{ env.DAGGER_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dagger-state-${{ env.DAGGER_VERSION }}-
      - name: Restore engine volume
        run: |
          docker volume create dagger-state
          if [ -f /tmp/dagger-state.tar ]; then
            volume=$(docker volume inspect --format '{{.Mountpoint}}' dagger-state)
            sudo tar --extract --file /tmp/dagger-state.tar --directory "$volume" --numeric-owner --same-owner --same-permissions --xattrs '--xattrs-include=*' --acls
          fi
      - name: Install Dagger CLI
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
      - name: Run Dagger pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: "docker-image://registry.dagger.io/engine:v${{ env.DAGGER_VERSION }}?container=dagger-engine-ci&volume=dagger-state"
        run: dagger call publish --token env://GITHUB_TOKEN
      - name: Snapshot engine volume
        run: |
          docker stop --time 60 dagger-engine-ci
          volume=$(docker volume inspect --format '{{.Mountpoint}}' dagger-state)
          sudo tar --create --file /tmp/dagger-state.tar --directory "$volume" --numeric-owner --xattrs '--xattrs-include=*' --acls --sparse .
