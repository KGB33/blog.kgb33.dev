name: "Build & Push Container Image"

concurrency: release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
permissions:
  contents: read
  packages: write
  actions: write
jobs:
  publish:
    name: "Build & Push to GHCR"
    runs-on: ubuntu-latest
    env:
      DAGGER_VERSION: "0.21.11"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
      - name: Setup Dagger
        id: dagger
        uses: ./.github/actions/setup-dagger
        with:
          version: ${{ env.DAGGER_VERSION }}
      - name: Run Dagger pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: ${{ steps.dagger.outputs.runner-host }}
        run: dagger call publish --token env://GITHUB_TOKEN
      - name: Snapshot Dagger
        uses: ./.github/actions/snapshot-dagger
